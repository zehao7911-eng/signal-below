<style>
:root{color-scheme:dark;--ink:#e5f1ed;--muted:#9db2b8;--cyan:#88f2e2;--gold:#ffc084;--line:#334d57;background:#09151d;font-family:system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 25% 8%,#1b3340,#0a1821 48%,#080f17);color:var(--ink);min-height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

#app{width:min(1060px,100%);margin:auto;padding:max(13px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left))}
.top,.heading,.boardline,.footer{display:flex;align-items:center;justify-content:space-between}
.top{gap:8px;padding-bottom:11px;border-bottom:1px solid #37515a}
.identity{display:flex;gap:10px;align-items:center;margin-right:auto;min-width:0}
.identity svg{width:38px;flex:none;fill:#17343a;stroke:#76d9c9;stroke-width:1.6}

.identity small,.eyebrow,.boardline,.metrics small,.footer,.pulse small,.tag{font:700 10px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.12em;color:var(--muted)}

<script>
(()=>{
'use strict';
const game=(()=>{
const directions = [[0,-1],[1,0],[0,1],[-1,0]];

const plans = [
  ['First Contact', 'Pump Annex', 5, [
    '###########','#..C......#','#.####.##.#','#......##.#','#.###.....#','#.#..###..#','#....C....#','#S#########','###########']],
  ['Blue Intake', 'Pump Annex', 6, [
    '###########','#....#...C#','#.##.#.##.#','#..#...#..#','##.#####.##','#..C...#..#','#.####....#','#S....d...#','###########']],
  ['Resonance Lock', 'Flooded Works', 6, [
    '###########','#....#...C#','#.##.g.##.#','#..#.#....#','#.r..#.#..#','#.##.#.####','#..#.#.C..#','#S....#####','###########']],
  ['Crossing Watch', 'Flooded Works', 6, [
    '###########','#....C....#','#.##.#.##.#','#..#.#.#..#','#..d...d..#','##.###.##.#','#C...#...C#','#....S....#','###########']],
  ['The Long Return', 'Flooded Works', 7, [
    '###########','#C..#...C.#','###.#.###.#','#...#.#...#','#.#.g...#.#','#.#.#.###.#','#.r.#...#.#','#S..#.#..C#','###########']],
  ['Copper Junction', 'Relay Deep', 7, [
    '###########','#....C....#','#.###.###.#','#..r#...#.#','##..g.d...#','#...#.###.#','#C..#...#C#','#....S....#','###########']],
  ['Dead Signal', 'Relay Deep', 8, [
    '###########','#C....#..C#','#.##..#.#.#','#....dg.#.#','###.#.#...#','#r..#.#.#.#','#.#...#.#C#','#S....g...#','###########']],
  ['The Last Relay', 'Relay Deep', 8, [
    '###########','#C..#....C#','#.#.#.###.#','#.#.g...#.#','#.r.#.d...#','#.#.#.###.#','#C..#...#C#','#....S....#','###########']],
];

const width = 11, height = 9;
const index = (x,y) => y*width+x;
const point = i => [i%width, Math.floor(i/width)];
function neighbor(i,d) {
  const [x,y]=point(i), [dx,dy]=directions[d];
  const nx=x+dx, ny=y+dy;
  return nx>=0&&ny>=0&&nx<width&&ny<height ? index(nx,ny) : -1;
}

const sectors = plans.map(([name,zone,budget,rows]) => {
  if (rows.length!==height || rows.some(row=>row.length!==width)) throw Error('Invalid sector layout');
  const cells=[...rows.join('')];
  const find = char => cells.flatMap((c,i)=>c===char?[i]:[]);
  const plain = i => cells[i]==='.';
  const patrols = find('d').map(center=>{
    const axis = [1,0].find(d=>plain(neighbor(center,d)) && plain(neighbor(center,(d+2)%4)));
    if (axis===undefined) return [center];
    const start=neighbor(center,(axis+2)%4), end=neighbor(center,axis);
    return [center,end,center,start];
  });
  return {name,zone,budget,cells,start:find('S')[0],cores:find('C'),relays:find('r'),gates:find('g'),patrols};
});

const freshProfile = () => ({best:sectors.map(()=>0),rewards:{like:false,comment:false},sound:true,run:null});
const open = (s,i,powered) => i>=0 && s.cells[i]!=='#' && (s.cells[i]!=='g'||powered);

function rememberNear(run,s) {
  run.seen[run.position]=1;
  for(let d=0;d<4;d++) {
    const n=neighbor(run.position,d);
    if(n>=0) run.seen[n]=1;
  }
}

function freshRun(level) {
  const s=sectors[level];
  const run={level,position:s.start,seen:Array(width*height).fill(0),taken:[],powered:false,
    patrol:s.patrols.map(()=>({step:0,stun:0})),turn:0,scans:0,bumps:0,won:false};
  rememberNear(run,s);
  return run;
}

const integer = (x,min,max) => Number.isInteger(x)&&x>=min&&x<=max;
function cleanProfile(raw) {
  const clean=freshProfile();
  if(!raw || typeof raw!=='object') return clean;
  clean.best=sectors.map((_,i)=>integer(raw.best?.[i],0,3)?raw.best[i]:0);
  for(let i=1;i<sectors.length;i++) if(!clean.best[i-1]) clean.best[i]=0;
  clean.rewards={like:raw.rewards?.like===true,comment:raw.rewards?.comment===true};
  clean.sound=raw.sound!==false;
  const r=raw.run;
  if(!r||!integer(r.level,0,sectors.length-1)||r.level>0&&!clean.best[r.level-1]) return clean;
  const s=sectors[r.level];
  if(!integer(r.position,0,width*height-1)||!open(s,r.position,r.powered===true)) return clean;
  if(!Array.isArray(r.seen)||r.seen.length!==width*height||r.seen.some(v=>v!==0&&v!==1)) return clean;
  if(!Array.isArray(r.taken)||r.taken.some(v=>!s.cores.includes(v))||new Set(r.taken).size!==r.taken.length) return clean;
  if(!Array.isArray(r.patrol)||r.patrol.length!==s.patrols.length||r.patrol.some((p,i)=>!p||!integer(p.step,0,s.patrols[i].length-1)||!integer(p.stun,0,2))) return clean;
  if(!integer(r.turn,0,100000)||!integer(r.scans,0,r.turn)||!integer(r.bumps,0,r.turn)) return clean;
  const won=r.won===true;
  if(won&&(r.position!==s.start||r.taken.length!==s.cores.length)) return clean;
  clean.run={level:r.level,position:r.position,seen:r.seen.slice(),taken:r.taken.slice(),
    powered:r.powered===true,patrol:r.patrol.map(p=>({...p})),turn:r.turn,scans:r.scans,bumps:r.bumps,won};
  rememberNear(clean.run,s);
  if(won) settle(clean);
  return clean;
}

function scoutPositions(run) {
  return sectors[run.level].patrols.map((path,i)=>path[run.patrol[i].step]);
}

function pulseMap(run) {
  const s=sectors[run.level], radius=5;
  const distances=new Map([[run.position,0]]);
  const queue=[run.position];
  for(const cell of queue) {
    const dist=distances.get(cell);
    if(dist>=radius) continue;
    for(let d=0;d<4;d++) {
      const next=neighbor(cell,d);
      if(next<0||distances.has(next)) continue;
      distances.set(next,dist+1);
      if(open(s,next,run.powered)) queue.push(next);
    }
  }
  return distances;
}

function action(run,input) {
  if(!run||run.won||run.turn>=100000) return null;
  const s=sectors[run.level], old=run.position;
  const scouts=scoutPositions(run);
  let pulse=null, relay=false, core=false, hit=false;
  if(input==='pulse') {
    pulse=pulseMap(run);
    for(const i of pulse.keys()) run.seen[i]=1;
    run.scans++;
    if(!run.powered&&s.relays.some(i=>pulse.has(i))) {
      run.powered=true;
      relay=true;
    }
    scouts.forEach((i,j)=>{if(pulse.has(i)) run.patrol[j].stun=2;});
  } else {
    if(!integer(input,0,3)) return null;
    const next=neighbor(old,input);
    if(!open(s,next,run.powered)) return {blocked:true,gate:s.cells[next]==='g'};
    run.position=next;
  }
  run.turn++;
  rememberNear(run,s);
  if(s.cores.includes(run.position)&&!run.taken.includes(run.position)) {
    run.taken.push(run.position);
    core=true;
  }
  if(run.position===s.start&&run.taken.length===s.cores.length) {
    run.won=true;
  } else {
    for(let i=0;i<scouts.length;i++) {
      const guard=run.patrol[i], path=s.patrols[i];
      if(guard.stun>0) {
        guard.stun--;
        continue;
      }
      guard.step=(guard.step+1)%path.length;
      if(run.position===path[guard.step]||run.position===scouts[i]) hit=true;
    }
    if(hit) {
      run.bumps++;
      run.position=s.start;
      rememberNear(run,s);
    }
  }
  return {old,pulse,relay,core,hit,won:run.won};
}

function rating(run) {
  return 1+Number(run.bumps===0)+Number(run.scans<=sectors[run.level].budget);
}

function settle(profile) {
  if(profile.run?.won) {
    const {level}=profile.run;
    profile.best[level]=Math.max(profile.best[level],rating(profile.run));
  }
}

function mergeProfiles(local,remote) {
  const incoming=cleanProfile(remote);
  return {...local,best:local.best.map((v,i)=>Math.max(v,incoming.best[i])),
    rewards:{like:local.rewards.like||incoming.rewards.like,comment:local.rewards.comment||incoming.rewards.comment},
    run:local.run||incoming.run};
}

return {directions,sectors,point,neighbor,freshProfile,freshRun,cleanProfile,mergeProfiles,action,settle,rating,width,height,scoutPositions};
})();
const makeScene=(()=>{
const {width,height,point,scoutPositions}=game;

const tile=48, margin=25;
const size=[width*tile+margin*2,height*tile+margin*2];
const themes=[
  {ground:'#0b2028',metal:'#1d3541',edge:'#426272',warm:'#ffc680'},
  {ground:'#12232e',metal:'#263b4d',edge:'#506780',warm:'#fabb83'},
  {ground:'#222333',metal:'#3c3849',edge:'#6c526a',warm:'#ffc287'},
];
const noise = i => (Math.sin(i*78.233+17.37)*43758.5453)%1+1;
const center = i => {
  const [x,y]=point(i);
  return [margin+x*tile+tile/2,margin+y*tile+tile/2];
};

function makeScene(canvas) {
  const ctx=canvas.getContext('2d',{alpha:false});
  let scale=1, offsetX=0, offsetY=0, cssWidth=1, cssHeight=1;
  function resize() {
    const rect=canvas.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    cssWidth=rect.width;
    cssHeight=rect.height;
    const pixelsX=Math.max(1,Math.round(cssWidth*dpr)), pixelsY=Math.max(1,Math.round(cssHeight*dpr));
    if(canvas.width!==pixelsX||canvas.height!==pixelsY) {
      canvas.width=pixelsX;

    burst(run.position,'#ff896d');tone([155,104],.05);
    notice='Scout contact. Back at the lift with your beacons and map.';
  } else if(outcome.relay) {
    burst(run.position,'#93ffbd');tone([330,493,740]);
    notice='Relay online. The copper gates are open.';
  } else if(outcome.core) {
    burst(run.position,'#ffc487');tone([392,587,784]);
    notice=run.taken.length===game.sectors[run.level].cores.length?'All beacons secured. Return to the lift.':'Beacon secured. Keep searching.';
  } else if(outcome.pulse) {
    notice='Echo mapped. Reached scouts pause briefly.';
  } else {
    tone([96],.019);
    if(run.taken.length===game.sectors[run.level].cores.length) notice='Lift is ready. Follow your map back.';
    else notice='Search the passage for amber beacons.';
  }
  if(outcome.won) {
    game.settle(profile);
    sdk.end();
    notice='Extraction complete.';
    burst(run.position,'#a5ffcb');tone([392,523,659,784],.052);
  }
  saveLocal();
  sdk.save();
  render();
  if(outcome.won) result();
}

function show(content) {
  sheet.innerHTML=content;
  if(!panel.open) panel.showModal();
}
function close() {if(panel.open)panel.close();}
function begin(level) {
  if(profile.run&&!profile.run.won) sdk.end();
  sdk.prepare();
  profile.run=game.freshRun(level);
  effects.pulse=null;effects.move=null;effects.sparks=[];
  notice='Pulse to reveal the passage. Recover the beacons, then return to the lift.';
  close();saveLocal();sdk.save();render();
}
const button=(text,action,primary=false)=>`<button class="button${primary?' primary':''}" data-action="${action}">${text}</button>`;
function guide() {
  show(`<div class="tag">OPERATOR BRIEF</div><h2>Find the signal.</h2>
    <p><strong>Pulse</strong> sends an echo five steps along connected passages. Echoes reveal nearby walls and tiles, power relays and briefly pause any scout they reach. Your map stays visible.</p>
    <p><strong>Move</strong> with the arrows, WASD, a swipe or a tap on an adjacent tile. Pick up every amber beacon by driving over it. Return to the lift when it turns green.</p>
    <p>Red scouts move when you act. A red dot shows the next tile when visible. Contact sends you to the lift with your discoveries intact.</p>
    <p>Earn one star for extraction, one for zero contacts, and one for staying within the pulse target. You can keep scanning beyond the target.</p>
    <div class="sheetbuttons">${button('Back to the sector','close',true)}</div>`);
}
function result() {
  const run=profile.run, rating=game.rating(run), last=run.level===game.sectors.length-1;
  const count=(n,word)=>n+' '+word+(n===1?'':'s');
  show(`<div class="tag">${last?'DIVISION REPORT':'EXTRACTION COMPLETE'}</div><h2>${last?'Signal restored.':'Back on the surface.'}</h2>
    <div class="resultStars" aria-label="${rating} out of 3 stars">${stars(rating)}</div>
    <p>${count(run.taken.length,'beacon')} recovered · ${count(run.scans,'pulse')} · ${count(run.bumps,'contact')}</p>
    <div class="sheetbuttons">${last?button('Sector map','map',true):button('Next sector','next',true)}${button('Replay','replay')}${button('View map','close')}</div>`);
}
function map() {
  const options=game.sectors.map((s,i)=>{
    const unlocked=i===0||profile.best[i-1]>0;
    return `<button class="button" data-action="level-${i}" ${unlocked?'':'disabled'}>${sectorNumber(i)} · ${s.name}<span>${unlocked?stars(profile.best[i]):'LOCKED'}</span></button>`;
  }).join('');
  show(`<div class="tag">RESCUE DIRECTORY</div><h2>Sector map</h2><div class="sectorlist">${options}</div>
    <div class="sheetbuttons">${button('Back','close',true)}${button('Restart sector','restart')}</div>`);
}
function confirmRestart(level) {
  show(`<div class="tag">LIFT CONTROL</div><h2>Start ${game.sectors[level].name}?</h2>
    <p>This replaces the current rescue checkpoint. Your best stars and cosmetics are saved.</p>
    <div class="sheetbuttons">${button('Start sector','begin-'+level,true)}${button('Keep checkpoint','close')}</div>`);
}
sheet.addEventListener('click',event=>{
  const choice=event.target.closest('button')?.dataset.action;
  if(choice==='close') close();
  if(choice==='map') map();
  if(choice==='restart') confirmRestart(currentRun().level);
  if(choice==='replay') begin(currentRun().level);
  if(choice==='next'&&profile.run?.won&&profile.run.level+1<game.sectors.length) begin(profile.run.level+1);
  if(choice?.startsWith('begin-')) begin(Number(choice.slice(6)));
  if(choice?.startsWith('level-')) {
    const level=Number(choice.slice(6));
    if(level===currentRun().level&&!profile.run?.won) close();
    else if(profile.run?.turn>0&&!profile.run.won) confirmRestart(level);
    else begin(level);
  }
});
byId('help').addEventListener('click',guide);
byId('menu').addEventListener('click',map);
byId('restart').addEventListener('click',()=>confirmRestart(currentRun().level));
byId('sound').addEventListener('click',()=>{
  profile.sound=!profile.sound;
  if(profile.sound){unlockAudio();tone([540]);}
  saveLocal();sdk.save();render();
});
byId('pulse').addEventListener('click',()=>execute('pulse'));
document.querySelectorAll('[data-move]').forEach(b=>b.addEventListener('click',()=>execute(Number(b.dataset.move))));
const keys={ArrowUp:0,w:0,ArrowRight:1,d:1,ArrowDown:2,s:2,ArrowLeft:3,a:3,' ':'pulse'};
window.addEventListener('keydown',event=>{
  if(panel.open||event.altKey||event.ctrlKey||event.metaKey) return;
  const key=event.key.length===1?event.key.toLowerCase():event.key, input=keys[key];
  if(input===undefined||key===' '&&event.target instanceof HTMLButtonElement) return;
  event.preventDefault();
  if(event.repeat&&(input==='pulse'||performance.now()<nextRepeat)) return;
  nextRepeat=performance.now()+145;
  execute(input);
});
canvas.addEventListener('pointerdown',event=>{
  if(pointer||!event.isPrimary||event.button!==0) return;
  pointer={id:event.pointerId,x:event.clientX,y:event.clientY};
  canvas.setPointerCapture(event.pointerId);
});
canvas.addEventListener('pointerup',event=>{
  if(pointer?.id!==event.pointerId) return;
  const dx=event.clientX-pointer.x, dy=event.clientY-pointer.y;
  pointer=null;
  if(Math.hypot(dx,dy)>16) {
    execute(Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0));
    return;
  }
  const tile=scene.at(event.clientX,event.clientY);
  const direction=game.directions.findIndex((_,i)=>game.neighbor(currentRun().position,i)===tile);
  if(tile>=0&&direction>=0) execute(direction);
});
for(const name of ['pointercancel','lostpointercapture']) canvas.addEventListener(name,()=>{pointer=null;});
document.addEventListener('visibilitychange',()=>{
  pointer=null;
  if(document.hidden) saveLocal();
});
window.addEventListener('pagehide',()=>{saveLocal();sdk.stop();});
window.addEventListener('pageshow',event=>{if(event.persisted) connect();});
window.addEventListener('resize',()=>scene.resize());
new ResizeObserver(()=>scene.resize()).observe(canvas);

function frame(now) {
  requestAnimationFrame(frame);
  if(document.hidden||now-lastFrame<1000/40) return;
  lastFrame=now;frameTime=now/1000;
  if(effects.pulse&&frameTime-effects.pulse.time>.82) effects.pulse=null;
  if(effects.move&&frameTime-effects.move.time>.2) effects.move=null;
  effects.sparks=effects.sparks.filter(p=>frameTime-p.time<.65);
  const run=currentRun();
  scene.frame(run,game.sectors[run.level],frameTime,effects,profile.rewards);
}

scene.resize();
connect();
requestAnimationFrame(frame);
if(profile.run?.won) result();
else if(profile.run?.turn) {
  notice='Checkpoint restored. Continue the rescue.';
  render();
}

})();
</script>
</body>
</html>
